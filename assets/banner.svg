<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0c16"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070913"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accentBlue" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)"/><stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(192, 132, 252, 0.25)"/><stop offset="100%" stop-color="rgba(192, 132, 252, 0.05)"/></linearGradient><linearGradient id="gridGlow" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".3"/><stop offset="100%" stop-color="#6366f1" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.35}50%{transform:scale(1.18) translate(30px,-20px);opacity:.65}}@keyframes floatPillLeft{0%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes floatPillRight{0%{transform:translateY(0) rotate(1deg)}50%{transform:translateY(14px) rotate(-1.5deg)}}@keyframes scanline{0%{transform:translateY(-100px);opacity:0}50%{opacity:.4}}.orb-blue{transform-origin:200px 100px;animation:pulseOrb 8s ease-in-out infinite}.orb-purple{transform-origin:1000px 240px;animation:pulseOrb 10s ease-in-out infinite 2s}.stream-line{stroke-dasharray:8 12;animation:dashCycle 4s linear infinite}.pill-left{animation:floatPillLeft 6s ease-in-out infinite}.pill-right{animation:floatPillRight 7s ease-in-out infinite 1s}</style><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><g stroke="#38bdf8" stroke-width="1" opacity=".12"><line x1="0" x2="1200" y1="40" y2="40"/><line x1="0" x2="1200" y1="100" y2="100"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="260" y2="260"/><line x1="0" x2="1200" y1="320" y2="320"/><line x1="150" x2="150" y1="0" y2="360"/><line x1="350" x2="350" y1="0" y2="360"/><line x1="600" x2="600" y1="0" y2="360"/><line x1="850" x2="850" y1="0" y2="360"/><line x1="1050" x2="1050" y1="0" y2="360"/></g><circle cx="240" cy="110" r="140" fill="#38bdf8" class="orb-blue" filter="url(#glow)" opacity=".25"/><circle cx="960" cy="220" r="160" fill="#a855f7" class="orb-purple" filter="url(#glow)" opacity=".22"/><g fill="none" opacity=".45"><path stroke="#38bdf8" stroke-width="2" d="M 50,70 Q 280,30 520,70 T 1150,70" class="stream-line"/><path stroke="#c084fc" stroke-width="2" d="M 50,300 Q 320,330 650,290 T 1150,300" class="stream-line" style="animation-direction:reverse;animation-duration:5s"/></g><g class="pill-left" opacity=".75"><rect width="180" height="38" x="70" y="240" fill="url(#accentBlue)" stroke="#38bdf8" stroke-width="1.2" rx="19"/><text x="160" y="264" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚙️ Constrained Logits</text></g><g class="pill-right" opacity=".75"><rect width="190" height="38" x="940" y="70" fill="url(#accentPurple)" stroke="#c084fc" stroke-width="1.2" rx="19"/><text x="1035" y="94" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Type-Safe Schemas</text></g><text x="600" y="110" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="4" text-anchor="middle">✦ CURATED LLM ECOSYSTEM &amp; FRAMEWORKS ✦</text><text x="600" y="180" fill="url(#textGrad)" filter="drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7))" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1" text-anchor="middle">Awesome LLM Prompting &amp; Guidance</text><text x="600" y="222" fill="#e2e8f0" filter="drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8))" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" letter-spacing=".5" text-anchor="middle">Structured Outputs • Constrained Generation • Grammar Engines • Production AI Rails</text><g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" transform="translate(600, 275)"><rect width="160" height="28" x="-260" y="-14" fill="#1e293b" stroke="#334155" rx="14"/><text x="-180" y="4" fill="#94a3b8">⚡ Pydantic Schemas</text><rect width="160" height="28" x="-80" y="-14" fill="#1e293b" stroke="#334155" rx="14"/><text x="0" y="4" fill="#94a3b8">🎯 Token-Level FSM/CFG</text><rect width="160" height="28" x="100" y="-14" fill="#1e293b" stroke="#334155" rx="14"/><text x="180" y="4" fill="#94a3b8">🔒 Guardrails &amp; Eval</text></g><rect width="1199" height="359" x=".5" y=".5" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" rx="16"/></svg>