<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Pill Gradients -->
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0.05)" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(192, 132, 252, 0.25)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.05)" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(30px, -20px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes floatPillLeft {
      0% { transform: translateY(0px) rotate(-1deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
      100% { transform: translateY(0px) rotate(-1deg); }
    }
    @keyframes floatPillRight {
      0% { transform: translateY(0px) rotate(1deg); }
      50% { transform: translateY(14px) rotate(-1.5deg); }
      100% { transform: translateY(0px) rotate(1deg); }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -80; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.4; }
      100% { transform: translateY(380px); opacity: 0; }
    }

    .orb-blue {
      transform-origin: 200px 100px;
      animation: pulseOrb 8s ease-in-out infinite;
    }
    .orb-purple {
      transform-origin: 1000px 240px;
      animation: pulseOrb 10s ease-in-out infinite 2s;
    }
    .stream-line {
      stroke-dasharray: 8 12;
      animation: dashCycle 4s linear infinite;
    }
    .pill-left {
      animation: floatPillLeft 6s ease-in-out infinite;
    }
    .pill-right {
      animation: floatPillRight 7s ease-in-out infinite 1s;
    }
    .scanner {
      animation: scanline 5s linear infinite;
    }
  </style>

  <!-- Deep Cosmic Background Canvas -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />

  <!-- Subtle Perspective Grid in Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Animated Glowing Atmospheric Orbs (Behind Content) -->
  <circle class="orb-blue" cx="240" cy="110" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.25" />
  <circle class="orb-purple" cx="960" cy="220" r="160" fill="#a855f7" filter="url(#glow)" opacity="0.22" />

  <!-- Dynamic Constrained-Decoding Guided Stream Lines -->
  <g fill="none" opacity="0.45">
    <path class="stream-line" d="M 50,70 Q 280,30 520,70 T 1150,70" stroke="#38bdf8" stroke-width="2" />
    <path class="stream-line" d="M 50,300 Q 320,330 650,290 T 1150,300" stroke="#c084fc" stroke-width="2" style="animation-direction: reverse; animation-duration: 5s;" />
  </g>

  <!-- Interactive Dynamic Background Badges / Floating Elements -->
  <g class="pill-left" opacity="0.75">
    <rect x="70" y="240" width="180" height="38" rx="19" fill="url(#accentBlue)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="160" y="264" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚙️ Constrained Logits</text>
  </g>
  <g class="pill-right" opacity="0.75">
    <rect x="940" y="70" width="190" height="38" rx="19" fill="url(#accentPurple)" stroke="#c084fc" stroke-width="1.2" />
    <text x="1035" y="94" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🛡️ Type-Safe Schemas</text>
  </g>

  <!-- Main Hero Titles (Cleanly in Foreground with Drop Shadow) -->
  <!-- Top Category Kicker -->
  <text x="600" y="110" 
        fill="#38bdf8" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="15" 
        font-weight="700" 
        letter-spacing="4" 
        text-anchor="middle">
    ✦ CURATED LLM ECOSYSTEM &amp; FRAMEWORKS ✦
  </text>

  <!-- Main Title -->
  <text x="600" y="180" 
        fill="url(#textGrad)" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="-1" 
        text-anchor="middle"
        filter="drop-shadow(0 4px 12px rgba(0, 0, 0, 0.7))">
    Awesome LLM Prompting &amp; Guidance
  </text>

  <!-- Subtitle -->
  <text x="600" y="222" 
        fill="#e2e8f0" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="17" 
        font-weight="500" 
        letter-spacing="0.5" 
        text-anchor="middle"
        filter="drop-shadow(0 2px 8px rgba(0, 0, 0, 0.8))">
    Structured Outputs • Constrained Generation • Grammar Engines • Production AI Rails
  </text>

  <!-- Pill Feature Highlights at bottom center -->
  <g transform="translate(600, 275)" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">
    <!-- Center pill: Pydantic -->
    <rect x="-260" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="-180" y="4" fill="#94a3b8">⚡ Pydantic Schemas</text>
    
    <rect x="-80" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="0" y="4" fill="#94a3b8">🎯 Token-Level FSM/CFG</text>
    
    <rect x="100" y="-14" width="160" height="28" rx="14" fill="#1e293b" stroke="#334155" />
    <text x="180" y="4" fill="#94a3b8">🔒 Guardrails &amp; Eval</text>
  </g>

  <!-- Border accent -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
</svg>
